services:
  postgres:
    image: postgres:14.24-alpine3.23
    container_name: booking-postgres
    restart: unless-stopped

    ports:
      - 5432:5432

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Reservario
    

    volumes:
      - ./db_data/:/var/lib/postgresql/data/